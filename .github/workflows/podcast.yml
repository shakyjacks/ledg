name: Sync podcast episodes
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
  push:
    paths: ["scripts/podcast.mjs", ".github/workflows/podcast.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/podcast.mjs
      - name: Save if changed
        run: |
          if [ -n "$(git status --porcelain podcast.json podcast-status.json)" ]; then
            git config user.name "LEDG podcast sync"
            git config user.email "actions@users.noreply.github.com"
            git add -A -- podcast.json podcast-status.json
            git commit -m "Update podcast episodes"
            git push
          fi
